<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problems in Group Theory</title>
    <style>
        body {
            background-color: #f4f1ea; /* Beige background matching the screenshot */
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 40px;
        }
        h1 {
            font-family: Georgia, 'Times New Roman', Times, serif; /* Large serif font for title */
            font-size: 5em;
            font-weight: normal;
            line-height: 1.1;
            margin: 0 0 20px 0;
            letter-spacing: -1px;
            color: #1a1a1a;
        }
        .description {
            font-size: 1.1em;
            color: #555;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 60px;
        }
        .divider {
            border-top: 1px solid #dcd7cc; /* Light horizontal divider */
            margin-bottom: 60px;
        }
        .section {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .section-title {
            flex: 1;
            min-width: 200px;
            font-family: Georgia, 'Times New Roman', Times, serif; /* Serif font for section header */
            font-size: 1.8em;
            font-weight: normal;
            margin: 0;
        }
        .section-content {
            flex: 2;
            min-width: 300px;
        }
        .row {
            display: flex;
            padding: 20px 0;
            border-bottom: 1px solid #dcd7cc;
        }
        .row:first-child {
            padding-top: 0;
        }
        .row:last-child {
            border-bottom: none;
        }
        .row-label {
            width: 150px;
            font-size: 0.8em;
            font-weight: bold;
            letter-spacing: 1px;
            color: #666;
            text-transform: uppercase;
        }
        .row-value {
            flex: 1;
            font-size: 1.05em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Header Section -->
        <h1>Problems in<br>Group Theory</h1>
        <p class="description">
            I am writing down all those problems related to group theory that I found interesting and that helped me to understand the subject better.
        
        </p>

    </div>
</body>
</html>
